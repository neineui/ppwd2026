<html>
    <head>
        <title>Atribut dari Tag Font</title>
    </head>
    <body>
        <p><font face="Arial">Ini Font Arial</font></p>
        <p><font face="Arial"><i>Ini Font Arial dan miring</i></font></p>
        <p><font face="Verdana" size="4" color="blue">
            <b>Ini Font Verdana berukuran 4, biru, dan tebal</b></font></p>
        <p align="center"><font face="Tahoma" color="red">
            <b>Ini Font Tahoma merah, tebal, dan di tengah</b></font></p>
        <p align="center"><font face="Arial" color="red">
            Ini Font Arial merah, </font>
            <font face="Verdana" color="blue">ini Font Verdana biru</font></p>
    </body>
</html>
