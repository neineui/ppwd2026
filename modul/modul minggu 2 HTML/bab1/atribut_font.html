<!DOCTYPE html>
<html>
<head>
    <title>Atribut Font HTML</title>
</head>
<body>
    <h1>Latihan Tag HTML</h1>
    <b>Ini tulisan tebal</b>
    <br>
    <i>Ini tulisan miring</i>
    <br>
    <u>Ini tulisan bergaris bawah</u>
    <br>
    Ini baris 1<br>
    Ini baris 2
    <br>
    Ini garis horizontal<hr>
    <br>
    <font color="red" face="Arial" size="12">
        Ini Font Arial berwarna merah dan berukuran 12 pt
    </font>
</body>
</html>
